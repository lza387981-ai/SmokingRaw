<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>SmokingRaw — Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">S</span><span>SMOKING<span class="accent">RAW</span><small>ADMIN PANEL</small></span></a><a class="small-action" href="/">На сайт</a></header><main><section class="view"><div class="section-title"><div><div class="eyebrow">УПРАВЛЕНИЕ</div><h2>Админ-панель</h2></div></div><div id="login" class="admin-box"><b>Вход администратора</b><p class="muted-note">Введи ADMIN_KEY из Cloudflare Pages → Settings → Variables and secrets.</p><input id="key" type="password" placeholder="ADMIN_KEY" autocomplete="off"><button class="primary-btn" id="loginBtn">Войти</button></div><div id="panel" class="hidden"><div class="admin-box"><b id="formTitle">Добавить позицию</b><input id="name" placeholder="Название"><input id="category" placeholder="Категория"><textarea id="description" placeholder="Описание"></textarea><input id="price" type="number" min="0" step="0.01" placeholder="Цена"><input id="image" type="url" placeholder="HTTPS-ссылка на изображение"><p class="muted-note">Пока принимается публичная HTTPS-ссылка на фото.</p><button class="primary-btn" id="save">Сохранить позицию</button><button class="small-action hidden" id="cancel">Отмена</button></div><div class="admin-box"><b>Контакт владельца в Telegram</b><input id="owner" placeholder="username без @"><button class="primary-btn" id="saveOwner">Сохранить контакт</button></div><div class="admin-box"><div class="section-title"><b>Каталог</b><button class="small-action" id="reload">Обновить</button></div><div id="items"></div></div><button class="small-action" id="logout">Выйти</button></div><p id="status" class="muted-note"></p></section></main></div><script src="admin.js"></script></body></html>
