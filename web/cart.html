<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Корзина клиента — SmokingRaw</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font:16px Arial,sans-serif;padding:24px 16px}.wrap{max-width:620px;margin:30px auto}.brand{color:#a3e635;font-weight:800;letter-spacing:2px}.panel{margin-top:22px;padding:22px;background:#151518;border:1px solid #303036;border-radius:18px}h1{font-size:25px;margin:8px 0 20px}.muted{color:#a1a1aa;font-size:13px}.item{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid #303036}.item b{display:block}.item small{display:block;color:#a1a1aa;margin-top:5px}.price{white-space:nowrap;text-align:right}.total{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding-top:20px}.error{color:#fca5a5;padding:18px 0}
</style></head><body><main class="wrap"><div class="brand">SMOKINGRAW</div><section class="panel"><div class="muted">Просмотр сохранённого списка клиента</div><h1>Корзина клиента</h1><div id="content" class="muted">Загружаем корзину…</div></section></main>
<script>
const money=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const id=new URLSearchParams(location.search).get("id")||"";const el=document.querySelector("#content");if(!id){el.innerHTML='<div class="error">В ссылке отсутствует номер корзины.</div>';return;}try{const r=await fetch("/api/carts/"+encodeURIComponent(id),{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Не удалось загрузить корзину");el.innerHTML=(d.items||[]).map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+money(x.price)+' × '+Number(x.quantity)+'</small></div><div class="price">'+money(Number(x.price)*Number(x.quantity))+'</div></div>').join("")+'<div class="total"><span>Итоговая цена 💸</span><span>'+money(d.total)+'</span></div><p class="muted">Создано: '+new Date(d.created_at).toLocaleString("ru-RU")+'</p>';}catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>';}})();
</script></body></html>
